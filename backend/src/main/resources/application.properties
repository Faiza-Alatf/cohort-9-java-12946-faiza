spring.application.name=backend

# SQL Server Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ContactManagementDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT Configuration
jwt.secret=mySecretKeyForJwtAuthentication123456789

# Cookie Configuration
app.cookie.secure=false

# Logging Configuration
logging.level.root=INFO
logging.level.backend=INFO

logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=7