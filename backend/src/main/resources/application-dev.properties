# SQL Server connection using Windows Integrated Authentication.

# Requires Windows Authentication and the Microsoft JDBC authentication library

# (mssql-jdbc_auth-*.dll) configured for the local development environment.

# For Linux/macOS, use a supported authentication scheme such as JavaKerberos

# with the required Kerberos configuration.

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ContactManagementDB;encrypt=true;trustServerCertificate=false;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
